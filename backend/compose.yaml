services:
  backend:
    build: .
    container_name: clawpi-backend
    restart: unless-stopped
    init: true
    environment:
      CLAWPI_DATABASE_URL: sqlite:////data/clawpi.db
      CLAWPI_JWT_SECRET: ${CLAWPI_JWT_SECRET:?CLAWPI_JWT_SECRET is required}
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
