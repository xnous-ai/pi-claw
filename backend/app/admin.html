<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClawPi 管理后台</title>
  <style>
    :root{color-scheme:light;--ink:#152033;--muted:#657084;--line:#dce2ea;--bg:#f4f6f8;--surface:#fff;--primary:#2165d6;--primary-soft:#eaf1ff;--success:#14805f;--danger:#b4233a;--danger-soft:#fce9ec}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .login{display:grid;min-height:100vh;place-items:center;padding:24px}.login-panel{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:30px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;width:40px;height:40px;place-items:center;border-radius:8px;background:var(--ink);color:#fff;font-size:20px;font-weight:800}.brand strong{font-size:20px}.login-panel h1{margin:30px 0 6px;font-size:24px}.hint{color:var(--muted);margin:0 0 20px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-weight:700}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #bdc7d5;border-radius:6px;background:#fff;color:var(--ink);padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}.field textarea{min-height:110px;resize:vertical}.check{display:flex;align-items:center;gap:9px;margin:8px 0 18px}.check input{width:18px;height:18px}
    .primary,.secondary,.danger,.link{min-height:42px;border-radius:6px;padding:9px 15px;font-weight:700}.primary{border:1px solid var(--primary);background:var(--primary);color:#fff}.secondary{border:1px solid #b9c3d0;background:#fff;color:var(--ink)}.danger{border:1px solid var(--danger);background:#fff;color:var(--danger)}.link{min-height:34px;border:0;background:transparent;color:var(--primary);padding:5px 8px}.primary:disabled,.secondary:disabled{cursor:not-allowed;opacity:.55}.wide{width:100%}
    .shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.sidebar{background:#111b2c;color:#fff;padding:22px 14px}.sidebar .brand{padding:0 8px 24px}.nav{display:grid;gap:5px}.nav button{border:0;border-radius:6px;background:transparent;color:#b8c4d6;padding:11px 12px;text-align:left;font-weight:700}.nav button:hover,.nav button.active{background:#24334a;color:#fff}.sidebar-foot{position:fixed;bottom:22px;width:180px}.sidebar-foot button{width:100%;border:1px solid #40506a;background:transparent;color:#dbe4f1;border-radius:6px;padding:9px}
    .main{min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;height:72px;border-bottom:1px solid var(--line);background:var(--surface);padding:0 28px}.topbar h1{font-size:20px;margin:0}.content{padding:26px 28px}.page{display:none}.page.active{display:block}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.page-head h2{font-size:24px;margin:0 0 4px}.page-head p{color:var(--muted);margin:0}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar .search{max-width:360px}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:12px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}.metric span{color:var(--muted);display:block}.metric strong{display:block;font-size:30px;margin-top:5px}.surface{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{border-bottom:1px solid var(--line);padding:13px 14px;text-align:left;vertical-align:middle}th{background:#f8f9fb;color:#536075;font-size:12px}tbody tr:last-child td{border-bottom:0}.actions{display:flex;gap:3px;white-space:nowrap}.status{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#9aa5b5}.dot.on{background:var(--success)}.tag{display:inline-block;border-radius:999px;background:#edf1f5;color:#536075;padding:3px 8px;font-size:12px}.tag.skill{background:#e5f5f0;color:#08705a}.tag.extension{background:#e9f0ff;color:#245fc4}.tag.mcp{background:#fff2d5;color:#825500}.empty{padding:42px;text-align:center;color:var(--muted)}
    dialog{width:min(640px,calc(100% - 32px));max-height:90vh;border:0;border-radius:8px;padding:0;box-shadow:0 8px 30px rgba(16,24,40,.18)}dialog::backdrop{background:rgba(12,20,33,.48)}.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;padding:18px 22px}.dialog-head{border-bottom:1px solid var(--line)}.dialog-head h3{font-size:19px;margin:0}.dialog-body{max-height:65vh;overflow:auto;padding:20px 22px}.dialog-foot{border-top:1px solid var(--line);justify-content:flex-end;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.message{position:fixed;right:24px;bottom:24px;z-index:10;max-width:420px;border-radius:6px;background:var(--ink);color:#fff;padding:12px 16px}.message.error{background:var(--danger)}
    @media(max-width:860px){.shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}.sidebar{padding:12px}.sidebar .brand{padding-bottom:12px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;padding:9px 4px}.sidebar-foot{display:none}.topbar{padding:0 16px}.content{padding:20px 16px}.metrics{grid-template-columns:1fr}.two{grid-template-columns:1fr}.page-head{align-items:stretch;flex-direction:column}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <form id="loginForm" class="login-panel">
      <div class="brand"><span class="mark">P</span><strong>ClawPi</strong></div>
      <h1>管理后台</h1><p class="hint">使用服务器管理密钥登录</p>
      <div class="field"><label for="adminKey">管理密钥</label><input id="adminKey" type="password" autocomplete="current-password" required></div>
      <button class="primary wide" type="submit">登录后台</button>
    </form>
  </section>

  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="mark">P</span><strong>ClawPi</strong></div>
      <nav class="nav">
        <button data-page="overview" class="active">概览</button>
        <button data-page="users">账号</button>
        <button data-page="devices">主机</button>
        <button data-page="capabilities">能力</button>
      </nav>
      <div class="sidebar-foot"><button id="logout">退出后台</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><h1 id="pageTitle">概览</h1><button id="refresh" class="secondary">刷新</button></header>
      <div class="content">
        <section id="page-overview" class="page active">
          <div class="page-head"><div><h2>运行概览</h2><p>账号、主机和能力服务的当前状态</p></div></div>
          <div id="metrics" class="metrics"></div>
        </section>
        <section id="page-users" class="page">
          <div class="page-head"><div><h2>账号管理</h2><p>管理手机号、状态和登录密码</p></div></div>
          <div class="toolbar"><input id="userSearch" class="search" placeholder="搜索称呼或手机号"><button class="secondary" data-search="users">搜索</button></div>
          <div class="surface table-wrap"><table><thead><tr><th>用户</th><th>手机号</th><th>主机</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody id="usersBody"></tbody></table><div id="usersEmpty" class="empty hidden">暂无账号</div></div>
        </section>
        <section id="page-devices" class="page">
          <div class="page-head"><div><h2>主机管理</h2><p>查看在线状态、归属和系统版本</p></div></div>
          <div class="toolbar"><input id="deviceSearch" class="search" placeholder="搜索名称、序列号、用户或手机号"><button class="secondary" data-search="devices">搜索</button></div>
          <div class="surface table-wrap"><table><thead><tr><th>主机</th><th>序列号</th><th>用户</th><th>状态</th><th>版本</th><th>最近在线</th><th>操作</th></tr></thead><tbody id="devicesBody"></tbody></table><div id="devicesEmpty" class="empty hidden">暂无主机</div></div>
        </section>
        <section id="page-capabilities" class="page">
          <div class="page-head"><div><h2>能力管理</h2><p>发布 Skill、Pi 插件和 MCP 桥接能力</p></div><button id="addCapability" class="primary">新增能力</button></div>
          <div class="surface table-wrap"><table><thead><tr><th>能力</th><th>类型</th><th>版本</th><th>来源</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="capabilitiesBody"></tbody></table><div id="capabilitiesEmpty" class="empty hidden">暂无能力</div></div>
        </section>
      </div>
    </main>
  </div>

  <dialog id="userDialog"><form id="userForm">
    <div class="dialog-head"><h3>编辑账号</h3><button type="button" class="link" data-close="userDialog">关闭</button></div>
    <div class="dialog-body"><input id="userId" type="hidden"><div class="two"><div class="field"><label>称呼</label><input id="userName" required></div><div class="field"><label>手机号</label><input id="userPhone" inputmode="tel" required></div></div><label class="check"><input id="userActive" type="checkbox">账号启用</label><div class="field"><label>重置密码（选填）</label><input id="userPassword" type="password" minlength="8" placeholder="至少 8 位"></div></div>
    <div class="dialog-foot"><button type="button" class="secondary" data-close="userDialog">取消</button><button class="primary" type="submit">保存账号</button></div>
  </form></dialog>

  <dialog id="deviceDialog"><form id="deviceForm">
    <div class="dialog-head"><h3>编辑主机</h3><button type="button" class="link" data-close="deviceDialog">关闭</button></div>
    <div class="dialog-body"><input id="deviceId" type="hidden"><div class="field"><label>主机名称</label><input id="deviceName" required></div><p id="deviceMeta" class="hint"></p></div>
    <div class="dialog-foot"><button type="button" class="secondary" data-close="deviceDialog">取消</button><button class="primary" type="submit">保存主机</button></div>
  </form></dialog>

  <dialog id="capabilityDialog"><form id="capabilityForm">
    <div class="dialog-head"><h3 id="capabilityDialogTitle">新增能力</h3><button type="button" class="link" data-close="capabilityDialog">关闭</button></div>
    <div class="dialog-body"><div class="two"><div class="field"><label>能力 ID</label><input id="capabilityId" pattern="[a-z0-9][a-z0-9._-]+" required></div><div class="field"><label>名称</label><input id="capabilityName" required></div><div class="field"><label>类型</label><select id="capabilityKind"><option value="skill">Skill</option><option value="extension">插件</option><option value="mcp">MCP</option></select></div><div class="field"><label>版本</label><input id="capabilityVersion" placeholder="1.0.0" required></div></div><div class="field"><label>介绍</label><textarea id="capabilityDescription"></textarea></div><div class="field"><label id="capabilitySourceLabel">npm / Git 来源</label><input id="capabilitySource" placeholder="npm:package@1.0.0 或 git:github.com/user/repo@commit"><p id="capabilitySourceHint" class="hint hidden"></p></div><div class="field"><label>权限说明</label><input id="capabilityPermissions" placeholder="网络访问, 文件读取, 命令执行"></div><div class="field" id="artifactField"><label>Skill ZIP 安装包</label><input id="capabilityArtifact" type="file" accept=".zip,application/zip"></div><label class="check"><input id="capabilityEnabled" type="checkbox">发布到 App 能力商店</label></div>
    <div class="dialog-foot"><button type="button" class="secondary" data-close="capabilityDialog">取消</button><button id="saveCapability" class="primary" type="submit">保存能力</button></div>
  </form></dialog>

  <div id="message" class="message hidden"></div>
  <script>
    const state={key:sessionStorage.getItem('clawpi.admin.key')||'',page:'overview',users:[],devices:[],capabilities:[]};
    const apiRoot=location.pathname.replace(/\/admin\/?$/,'');
    const $=id=>document.getElementById(id); const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date=value=>value?new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)):'-';
    function notify(text,error=false){const el=$('message');el.textContent=text;el.className=`message${error?' error':''}`;setTimeout(()=>el.classList.add('hidden'),3000)}
    async function api(path,options={}){const response=await fetch(apiRoot+path,{...options,headers:{'X-Admin-Key':state.key,...(options.body instanceof ArrayBuffer?{'Content-Type':'application/zip'}:{'Content-Type':'application/json'}),...options.headers}});const body=await response.json().catch(()=>null);if(!response.ok)throw new Error(Array.isArray(body?.detail)?body.detail.map(x=>x.msg).join('；'):body?.detail||`请求失败（${response.status}）`);return body}
    function showApp(){state.key=sessionStorage.getItem('clawpi.admin.key')||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');loadPage()}
    async function loadPage(){try{if(state.page==='overview')await loadOverview();if(state.page==='users')await loadUsers();if(state.page==='devices')await loadDevices();if(state.page==='capabilities')await loadCapabilities()}catch(error){notify(error.message,true);if(error.message.includes('管理密钥'))logout()}}
    async function loadOverview(){const x=await api('/v1/admin/overview');$('metrics').innerHTML=[['账号总数',x.users],['启用账号',x.activeUsers],['主机总数',x.devices],['在线主机',x.onlineDevices],['能力总数',x.capabilities],['已发布能力',x.publishedCapabilities]].map(([a,b])=>`<div class="metric"><span>${a}</span><strong>${b}</strong></div>`).join('')}
    async function loadUsers(){state.users=await api('/v1/admin/users?q='+encodeURIComponent($('userSearch').value));$('usersBody').innerHTML=state.users.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><small>${esc(x.id)}</small></td><td>${esc(x.phone)||'<span class="tag">待设置</span>'}</td><td>${x.deviceCount} 台</td><td><span class="status"><i class="dot ${x.isActive?'on':''}"></i>${x.isActive?'启用':'停用'}</span></td><td>${date(x.createdAt)}</td><td><div class="actions"><button class="link" onclick="editUser('${x.id}')">编辑</button><button class="link" onclick="deleteUser('${x.id}')">删除</button></div></td></tr>`).join('');$('usersEmpty').classList.toggle('hidden',state.users.length>0)}
    async function loadDevices(){state.devices=await api('/v1/admin/devices?q='+encodeURIComponent($('deviceSearch').value));$('devicesBody').innerHTML=state.devices.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.serial)}</td><td>${x.owner?`${esc(x.owner.name)}<br><small>${esc(x.owner.phone)||'待设置手机号'}</small>`:'<span class="tag">未绑定</span>'}</td><td><span class="status"><i class="dot ${x.status==='online'?'on':''}"></i>${x.status==='online'?'在线':'离线'}</span></td><td>${esc(x.version)}</td><td>${date(x.lastSeenAt)}</td><td><div class="actions"><button class="link" onclick="editDevice('${x.id}')">编辑</button>${x.owner?`<button class="link" onclick="releaseDevice('${x.id}')">解绑</button>`:''}</div></td></tr>`).join('');$('devicesEmpty').classList.toggle('hidden',state.devices.length>0)}
    const capabilityKindLabel=kind=>kind==='skill'?'Skill':kind==='mcp'?'MCP':'插件';
    async function loadCapabilities(){state.capabilities=await api('/v1/admin/capabilities');$('capabilitiesBody').innerHTML=state.capabilities.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><small>${esc(x.id)}</small></td><td><span class="tag ${x.kind}">${capabilityKindLabel(x.kind)}</span></td><td>${esc(x.version)}</td><td>${x.source?esc(x.source):x.artifactAvailable?'已上传 ZIP':'未配置'}</td><td><span class="status"><i class="dot ${x.enabled?'on':''}"></i>${x.enabled?'已发布':'未发布'}</span></td><td>${date(x.updatedAt)}</td><td><div class="actions"><button class="link" onclick="editCapability('${x.id}')">编辑</button><button class="link" onclick="deleteCapability('${x.id}')">删除</button></div></td></tr>`).join('');$('capabilitiesEmpty').classList.toggle('hidden',state.capabilities.length>0)}
    function editUser(id){const x=state.users.find(x=>x.id===id);$('userId').value=x.id;$('userName').value=x.name;$('userPhone').value=x.phone;$('userActive').checked=x.isActive;$('userPassword').value='';$('userDialog').showModal()}
    function editDevice(id){const x=state.devices.find(x=>x.id===id);$('deviceId').value=x.id;$('deviceName').value=x.name;$('deviceMeta').textContent=`${x.serial} · ${x.status==='online'?'在线':'离线'}`;$('deviceDialog').showModal()}
    function editCapability(id){const x=state.capabilities.find(x=>x.id===id);$('capabilityDialogTitle').textContent='编辑能力';$('capabilityId').value=x.id;$('capabilityId').disabled=true;$('capabilityName').value=x.name;$('capabilityKind').value=x.kind;$('capabilityVersion').value=x.version;$('capabilityDescription').value=x.description;$('capabilitySource').value=x.source;$('capabilityPermissions').value=x.permissions.join(', ');$('capabilityEnabled').checked=x.enabled;$('capabilityArtifact').value='';toggleArtifact();$('capabilityDialog').showModal()}
    function newCapability(){$('capabilityForm').reset();$('capabilityDialogTitle').textContent='新增能力';$('capabilityId').disabled=false;$('capabilityVersion').value='1.0.0';toggleArtifact();$('capabilityDialog').showModal()}
    function toggleArtifact(){const kind=$('capabilityKind').value;const mcp=kind==='mcp';$('artifactField').classList.toggle('hidden',kind!=='skill');$('capabilitySourceLabel').textContent=mcp?'MCP npm / Git 来源':'npm / Git 来源';$('capabilitySource').placeholder=mcp?'npm:pi-mcp-bridge@1.0.0 或 Git 地址':'npm:package@1.0.0 或 git:github.com/user/repo@commit';$('capabilitySourceHint').textContent=mcp?'请填写兼容 Pi 的 MCP 桥接插件包。用户安装后，主机会直接从此来源安装。':'';$('capabilitySourceHint').classList.toggle('hidden',!mcp)}
    async function deleteUser(id){if(!confirm('删除账号并解绑其全部主机？此操作不可撤销。'))return;try{await api('/v1/admin/users/'+id,{method:'DELETE'});notify('账号已删除');loadUsers()}catch(e){notify(e.message,true)}}
    async function releaseDevice(id){if(!confirm('解绑这台主机？主机会立即断开。'))return;try{await api(`/v1/admin/devices/${id}/claim`,{method:'DELETE'});notify('主机已解绑');loadDevices()}catch(e){notify(e.message,true)}}
    async function deleteCapability(id){if(!confirm('删除这个能力？已安装的主机仍可卸载。'))return;try{await api('/v1/admin/capabilities/'+id,{method:'DELETE'});notify('能力已删除');loadCapabilities()}catch(e){notify(e.message,true)}}
    function logout(){sessionStorage.removeItem('clawpi.admin.key');state.key='';$('app').classList.add('hidden');$('login').classList.remove('hidden')}
    $('loginForm').addEventListener('submit',async e=>{e.preventDefault();state.key=$('adminKey').value;try{await api('/v1/admin/overview');sessionStorage.setItem('clawpi.admin.key',state.key);showApp()}catch(error){notify(error.message,true)}});
    $('logout').onclick=logout;$('refresh').onclick=loadPage;$('addCapability').onclick=newCapability;$('capabilityKind').onchange=toggleArtifact;
    document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{state.page=button.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('page-'+state.page).classList.add('active');$('pageTitle').textContent=button.textContent;loadPage()});
    document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).close());document.querySelectorAll('[data-search]').forEach(button=>button.onclick=()=>button.dataset.search==='users'?loadUsers():loadDevices());
    $('userForm').onsubmit=async e=>{e.preventDefault();const id=$('userId').value;try{await api('/v1/admin/users/'+id,{method:'PUT',body:JSON.stringify({name:$('userName').value,phone:$('userPhone').value,isActive:$('userActive').checked})});if($('userPassword').value)await api(`/v1/admin/users/${id}/password`,{method:'POST',body:JSON.stringify({newPassword:$('userPassword').value})});$('userDialog').close();notify('账号已保存');loadUsers()}catch(error){notify(error.message,true)}};
    $('deviceForm').onsubmit=async e=>{e.preventDefault();try{await api('/v1/admin/devices/'+$('deviceId').value,{method:'PUT',body:JSON.stringify({name:$('deviceName').value})});$('deviceDialog').close();notify('主机已保存');loadDevices()}catch(error){notify(error.message,true)}};
    $('capabilityForm').onsubmit=async e=>{e.preventDefault();const id=$('capabilityId').value;const current=state.capabilities.find(x=>x.id===id);const existing=!!current;const file=$('capabilityArtifact').files[0];const payload={id,name:$('capabilityName').value,kind:$('capabilityKind').value,description:$('capabilityDescription').value,version:$('capabilityVersion').value,source:$('capabilitySource').value,permissions:$('capabilityPermissions').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),enabled:$('capabilityEnabled').checked};const button=$('saveCapability');button.disabled=true;try{const deferred=file&&payload.enabled&&!current?.artifactAvailable;await api('/v1/admin/capabilities'+(existing?'/'+id:''),{method:existing?'PUT':'POST',body:JSON.stringify({...payload,enabled:deferred?false:payload.enabled})});if(file)await api(`/v1/admin/capabilities/${id}/artifact`,{method:'PUT',body:await file.arrayBuffer()});if(deferred)await api('/v1/admin/capabilities/'+id,{method:'PUT',body:JSON.stringify(payload)});$('capabilityDialog').close();notify('能力已保存');loadCapabilities()}catch(error){notify(error.message,true)}finally{button.disabled=false}};
    if(state.key)showApp();
  </script>
</body>
</html>
